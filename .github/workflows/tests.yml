name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline tests
        run: python tests/test_offline.py
      - name: Repository hygiene (allowlist, tracked files)
        run: python tests/test_repo_hygiene.py
      - name: CLI smoke test
        run: |
          python -m rhkb --help
          python -m rhkb sources
          python -m rhkb fetch --dry-run
